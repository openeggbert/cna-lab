<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iron Gang / Web Build</title>
    <style>
      :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11100e;color:#e8e3d8;font:14px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}.frame{width:min(1280px,100%)}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font:11px monospace;letter-spacing:.1em;color:#9c988f}.bar a{color:#ec6b36;text-decoration:none}.screen{background:#050505;border:1px solid #4a4036;box-shadow:0 18px 80px #000;aspect-ratio:16/9;position:relative}canvas{display:block;width:100%;height:100%}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#ec6b36;font:12px monospace;letter-spacing:.14em;pointer-events:none}.hint{margin-top:14px;color:#9c988f;font:11px monospace;line-height:1.6}.hint strong{color:#e8e3d8}
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="bar"><span>IRON GANG / WEBGL2 PROTOTYPE</span><a href="./index.html">← BACK TO DOSSIER</a></div>
      <div class="screen"><div class="loading" id="loading">LOADING DISTRICT 01…</div><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>
      <p class="hint"><strong>CONTROLS</strong> W/S move · A/D strafe · arrows turn · Shift sprint · E enter/exit car · Enter advance dialogue · F5/F9 save/load · R reset</p>
    </div>
    <script>
      var Module = { canvas: document.getElementById('canvas'), onRuntimeInitialized: function () { document.getElementById('loading').style.display = 'none'; } };
    </script>
    <script src="./build/iron_gang.js"></script>
  </body>
</html>
